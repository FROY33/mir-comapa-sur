  <style>
*,*::before,*::after {margin:0;padding:0;box-sizing:border-box;}
body {font-family:'Plus Jakarta Sans',sans-serif;background:var(--color-surface);color:var(--color-text-primary);display:flex;min-height:100vh;}
/* WELCOME */
    .welcome-row {display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;}
.welcome-left h1 {font-size:22px;font-weight:700;margin-bottom:2px;}
.welcome-left p {font-size:13px;color:var(--color-text-secondary);}
.welcome-date {font-size:12px;color:var(--color-text-secondary);background:var(--color-bg);border:1px solid var(--color-border);border-radius:10px;padding:7px 14px;font-weight:600;}
.role-chip {display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700;background:var(--color-info-tint);color:var(--color-info);margin-left:8px;vertical-align:middle;}
/* KPI GRID */
    .kpi-grid {display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:24px;}
.kpi-icon {width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;margin-bottom:12px;}
.kpi-icon svg {width:18px;height:18px;}
.kpi-icon.blue {background:var(--color-info-tint);}
.kpi-icon.blue svg {color:var(--color-info);}
.kpi-icon.purple {background:var(--color-corregido-tint);}
.kpi-icon.purple svg {color:var(--color-corregido);}
.kpi-icon.orange {background:var(--color-observado-tint);}
.kpi-icon.orange svg {color:var(--color-observado);}
.kpi-icon.green {background:var(--color-success-tint);}
.kpi-icon.green svg {color:var(--color-success);}
.kpi-icon.red {background:var(--color-danger-tint);}
.kpi-icon.red svg {color:var(--color-danger);}
.kpi-sub {font-size:11px;color:var(--color-text-secondary);}
/* GRID 2 COL */
    .two-col {display:grid;grid-template-columns:1fr 340px;gap:16px;margin-bottom:16px;}
.sc-link {font-size:12px;font-weight:600;color:var(--color-info);text-decoration:none;}
.sc-link:hover {text-decoration:underline;}
/* PENDIENTES TABLE */
    .pend-table {width:100%;border-collapse:collapse;}
.pend-table th {font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--color-text-secondary);padding:0 8px 8px;text-align:left;white-space:nowrap;}
.pend-table td {padding:10px 8px;border-top:1px solid var(--color-border);vertical-align:middle;}
.pend-table tr:first-child td {border-top:none;}
.pend-table tr:hover td {background:var(--color-neutral-50);}
.act-id {font-size:10px;font-weight:700;font-family:monospace;color:var(--color-primary);}
.act-name {font-size:13px;font-weight:600;color:var(--color-text-primary);max-width:220px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.act-name-sub {font-size:11px;color:var(--color-text-secondary);margin-top:1px;}
.prio-badge {display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:10px;font-weight:700;white-space:nowrap;}
.prio-alta {background:var(--color-danger-tint);color:var(--color-danger);}
.prio-media {background:var(--color-warning-tint);color:var(--color-warning-dark);}
.prio-normal {background:var(--color-neutral-100);color:var(--color-text-secondary);}
.prio-vencida {background:var(--color-text-primary);color:white;}
.prio-badge::before {content:'';width:5px;height:5px;border-radius:50%;}
.prio-alta::before {background:var(--color-danger);}
.prio-media::before {background:var(--color-warning-dark);}
.prio-normal::before {background:var(--color-text-muted);}
.prio-vencida::before {background:white;}
.dias-chip {font-size:11px;font-weight:700;}
.dias-chip.urgente {color:var(--color-danger);}
.dias-chip.proximo {color:var(--color-warning);}
.dias-chip.normal {color:var(--color-success);}
.btn-revisar {display:inline-flex;align-items:center;gap:5px;padding:5px 12px;border-radius:8px;font-size:11px;font-weight:700;border:none;cursor:pointer;text-decoration:none;font-family:inherit;transition:opacity .12s;}
.btn-revisar.blue {background:var(--color-info-tint);color:var(--color-info);}
.btn-revisar.purple {background:var(--color-corregido-tint);color:var(--color-corregido);}
.btn-revisar:hover {opacity:.80;}
.btn-revisar svg {width:12px;height:12px;}
.corregido {background:var(--color-corregido-tint);color:var(--color-corregido);}
.corregido::before {background:var(--color-corregido);}
.enviado_revision {background:var(--color-info-tint);color:var(--color-info);}
.enviado_revision::before {background:var(--color-info);}
.observado {background:var(--color-observado-tint);color:var(--color-observado);}
.observado::before {background:var(--color-observado);}
.aprobado_revisor {background:var(--color-success-tint);color:var(--color-success);}
.aprobado_revisor::before {background:var(--color-success);}
.listo_validar { background: var(--color-success-tint); color: var(--color-success); }
.listo_validar::before { background: var(--color-success); }
.cerrado { background: var(--color-success-tint); color: var(--color-success-dark); }
.cerrado::before { background: var(--color-success); }
.vencido {background:var(--color-danger-tint);color:var(--color-danger);}
.vencido::before {background:var(--color-danger);}
/* TIMELINE */
    .tl {position:relative;padding-left:20px;display:flex;flex-direction:column;gap:0;}
.tl::before {content:'';position:absolute;left:6px;top:8px;bottom:8px;width:2px;background:var(--color-border);}
.tl-item {position:relative;padding-bottom:14px;}
.tl-item:last-child {padding-bottom:0;}
.tl-dot {position:absolute;left:-17px;top:4px;width:10px;height:10px;border-radius:50%;border:2px solid var(--color-bg);}
.tl-dot.revisor {background:var(--color-info);}
.tl-dot.enlace {background:var(--color-primary);}
.tl-dot.sistema {background:var(--color-text-muted);}
.tl-time {font-size:10px;color:var(--color-text-muted);margin-bottom:1px;}
.tl-act {font-size:12px;font-weight:600;color:var(--color-text-primary);}
.tl-sub {font-size:11px;color:var(--color-text-secondary);margin-top:2px;}
/* URGENTES */
    .urgente-item {display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--color-border);}
.urgente-item:last-child {border-bottom:none;padding-bottom:0;}
.ui-icon {width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.ui-icon.orange {background:var(--color-observado-tint);}
.ui-icon.orange svg {color:var(--color-observado);}
.ui-icon.red {background:var(--color-danger-tint);}
.ui-icon.red svg {color:var(--color-danger);}
.ui-body {flex:1;min-width:0;}
.ui-id {font-size:10px;font-family:monospace;font-weight:700;color:var(--color-primary);}
.ui-name {font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ui-meta {font-size:11px;color:var(--color-text-secondary);margin-top:1px;}
.ui-action {flex-shrink:0;}
/* CTA ROW */
    .cta-row {display:flex;gap:10px;margin-bottom:16px;}
.btn-cta {display:inline-flex;align-items:center;gap:7px;padding:11px 20px;border-radius:12px;font-size:13px;font-weight:700;border:none;cursor:pointer;font-family:inherit;text-decoration:none;transition:opacity .12s;}
.btn-cta:hover {opacity:.88;}
.btn-cta.primary {background:var(--color-info);color:white;}
.btn-cta.secondary {background:var(--color-bg);color:var(--color-text-primary);border:1px solid var(--color-border);}
.btn-cta svg {width:16px;height:16px;}
.nivel-fin {background:var(--color-corregido-tint);color:var(--color-corregido);}
.nivel-proposito {background:var(--color-info-tint);color:var(--color-info);}
.nivel-componente {background:var(--color-success-tint);color:var(--color-info);}
.nivel-actividad {background:var(--color-neutral-100);color:var(--color-text-primary);}

    @keyframes rvrPulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: .25; transform: scale(.6); }
    }
</style>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const actsRevisor = getActividadesRevisor();
  const pendientes  = actsRevisor.filter(a => ['enviado_revision','pendiente_revision'].includes(a.estado));
  const corregidas  = actsRevisor.filter(a => a.estado === 'corregido');
  const observadas  = actsRevisor.filter(a => a.estado === 'observado');
  const aprobadas   = actsRevisor.filter(a => ['aprobado_revisor','cerrado'].includes(a.estado));
  const urgentes    = actsRevisor.filter(a => {
    const d = diasRestantes(a.fechaLimite);
    return ['enviado_revision','pendiente_revision','corregido'].includes(a.estado) && (d <= 14);
  }).sort((a, b) => diasRestantes(a.fechaLimite) - diasRestantes(b.fechaLimite));

  // Recent timeline: all historial entries with actor, most recent first
  const allMovements = [];
  actsRevisor.forEach(a => {
    a.historial.forEach(h => {
      allMovements.push({ ...h, actId: a.id, actNombre: a.nombreIndicador });
    });
  });
  allMovements.sort((a, b) => {
    const da = a.fecha + ' ' + a.hora;
    const db = b.fecha + ' ' + b.hora;
    return da < db ? 1 : da > db ? -1 : 0;
  });
  const recentMovs = allMovements.slice(0, 6);

  // Pending to review: pendientes + corregidas, sorted by prioridad then fecha
  const enBandeja = [...pendientes, ...corregidas].sort((a, b) => {
    const pOrder = { alta: 0, media: 1, normal: 2 };
    const pa = pOrder[prioridad(a)] ?? 3;
    const pb = pOrder[prioridad(b)] ?? 3;
    if (pa !== pb) return pa - pb;
    return diasRestantes(a.fechaLimite) - diasRestantes(b.fechaLimite);
  });

  const PRIORIDAD_CFG = {
    alta:    { cls: 'prio-alta',    label: 'Alta' },
    media:   { cls: 'prio-media',   label: 'Media' },
    normal:  { cls: 'prio-normal',  label: 'Normal' },
    vencida: { cls: 'prio-vencida', label: 'Vencida' }
  };

  function diaChip(act) {
    const d = diasRestantes(act.fechaLimite);
    const cls = d < 0 ? '' : d <= 7 ? 'urgente' : d <= 14 ? 'proximo' : 'normal';
    const txt = d < 0 ? 'Vencida' : d === 0 ? 'Hoy' : `${d}d`;
    return `<span class="dias-chip ${cls}">${txt}</span>`;
  }
  function estadoBadge(e) {
    const _ecfg = (typeof ESTADO_CFG_MIR !== 'undefined' ? ESTADO_CFG_MIR : (typeof ESTADO_CFG !== 'undefined' ? ESTADO_CFG : {}));
    const cfg = _ecfg[e] || { label: e, cls: e };
    return `<span class="estado-badge ${escaparHTML(cfg.cls)}">${escaparHTML(cfg.label)}</span>`;
  }
  function prioBadge(a) {
    const p = prioridad(a);
    const c = PRIORIDAD_CFG[p] || PRIORIDAD_CFG.normal;
    return `<span class="prio-badge ${c.cls}">${c.label}</span>`;
  }
  function nivelBadge(a) {
    const n = (typeof NIVEL_CFG !== 'undefined' && NIVEL_CFG[a.nivel]) || { label: a.nivel || '—', cls: 'nivel-actividad' };
    return `<span class="nivel-badge ${n.cls}">${escaparHTML(n.label)}</span>`;
  }
  function rolDotCls(rol) {
    const r = (rol||'').toLowerCase();
    if (r.includes('revisor')) return 'revisor';
    if (r.includes('enlace'))  return 'enlace';
    return 'sistema';
  }

  const pendientesRows = enBandeja.length === 0
    ? '<tr><td colspan="6" style="text-align:center;padding:24px;color:var(--color-text-secondary);font-size:13px;">Sin indicadores pendientes de revisión</td></tr>'
    : enBandeja.map(a => `
        <tr>
          <td>
            <div class="act-id">${escaparHTML(a.id)}</div>
            <div class="act-name">${isoBadge(a)}${escaparHTML(a.nombreIndicador)}</div>
            <div class="act-name-sub">${nivelBadge(a)} · ${escaparHTML(a.periodo)}</div>
          </td>
          <td>${estadoBadge(a.estado)}</td>
          <td>${prioBadge(a)}</td>
          <td>${diaChip(a)} <span style="font-size:11px;color:var(--color-text-secondary);">${escaparHTML(formatFecha(a.fechaLimite))}</span></td>
          <td style="font-size:11px;color:var(--color-text-secondary);">${escaparHTML(formatFecha(fechaEnvio(a)))}</td>
          <td>
            <a class="btn-revisar ${a.estado==='corregido'?'purple':'blue'}" href="detalle-actividad.html?id=${encodeURIComponent(a.id)}&amp;rol=revisor">
              ${a.estado==='corregido'?'Revisar corrección':'Revisar'}
              <svg fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="m8.25 4.5 7.5 7.5-7.5 7.5"/></svg>
            </a>
          </td>
        </tr>`).join('');

  const timelineHtml = recentMovs.map(m => `
    <div class="tl-item">
      <div class="tl-dot ${rolDotCls(m.rol)}"></div>
      <p class="tl-time">${escaparHTML(m.fecha)} · ${escaparHTML(m.hora)}</p>
      <p class="tl-act">${escaparHTML(m.accion)}</p>
      <p class="tl-sub">${escaparHTML(m.actId)} · ${escaparHTML(m.actNombre.slice(0, 42))}${m.actNombre.length > 42 ? '…' : ''}</p>
    </div>`).join('');

  const urgentesHtml = urgentes.length === 0
    ? '<p style="font-size:13px;color:var(--color-text-secondary);padding:8px 0;">Sin indicadores próximos a vencer.</p>'
    : urgentes.slice(0, 4).map(a => {
        const d = diasRestantes(a.fechaLimite);
        const icCls = d <= 7 ? 'red' : 'orange';
        return `
          <div class="urgente-item">
            <div class="ui-icon ${icCls}">

  (function() {
    var CICLO_KEY = 'comapa-ciclo';
    function cpParseDate(s) {
      if (!s) return null;
      var p=s.split('-'), d=new Date(+p[0],+p[1]-1,+p[2]); d.setHours(0,0,0,0); return d;
    }
    function cpGetEstado(c) {
      if (!c||!c.faseCaptura||!c.faseRevision) return 'inactivo';
      if (c.cerradoManualmente) return 'cerrado';
      var h=new Date(); h.setHours(0,0,0,0);
      var c0=cpParseDate(c.faseCaptura.inicio), c1=cpParseDate(c.faseCaptura.fin);
      var r0=cpParseDate(c.faseRevision.inicio), r1=cpParseDate(c.faseRevision.fin);
      if (!c0||!c1||!r0||!r1) return 'inactivo';
      if (h<c0) return 'pendiente';
      if (h>=c0&&h<=c1) return 'captura';
      if (h>c1&&h<r0) return 'entre_fases';
      if (h>=r0&&h<=r1) return 'revision';
      return 'cerrado';
    }
    function cpFmt(s) {
      if (!s) return '';
      var p=s.split('-'), ms=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
      return +p[2]+' '+ms[+p[1]-1]+'. '+p[0];
    }
    function cpDias(d) {
      var h=new Date(); h.setHours(0,0,0,0);
      return Math.max(0,Math.round((d-h)/(1000*60*60*24)));
    }
    try {
      var ciclo = JSON.parse(localStorage.getItem(CICLO_KEY));
      var est = cpGetEstado(ciclo);
      var banner = null;
      if (est==='revision') {
        var r1 = cpParseDate(ciclo.faseRevision.fin);
        var dias = cpDias(r1);
        banner = {
          bg:'#EFF6FF', border:'#BFDBFE', dot:'#3B82F6',
          title: 'Ciclo de planeación — Revisión de metas abierta',
          detail: 'Tienes hasta el '+cpFmt(ciclo.faseRevision.fin)+' para revisar y aprobar las metas enviadas por los enlaces. '+
                  (dias===0?'Vence hoy.': dias===1?'Queda 1 día.':'Quedan '+dias+' días.'),
          href: 'planeacion-metas-revisor.html',
          btn: 'Revisar metas',
          pulse: '@keyframes cp-pulse-b{0%,100%{box-shadow:0 0 0 0 rgba(59,130,246,.4);}50%{box-shadow:0 0 0 5px rgba(59,130,246,0);}}'

      } else if (est==='captura'||est==='entre_fases') {

          bg:'#F5F3FF', border:'#DDD6FE', dot:'#8B5CF6',
          title: 'Ciclo de planeación en curso — Fase de captura',

        };

      if (!banner) return;
      var styleEl = document.createElement('style');
      styleEl.textContent = '.cp-banner{display:flex;align-items:center;gap:14px;border-radius:14px;padding:14px 18px;margin-bottom:20px;border:1.5px solid;}'
        +'.cp-banner-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}'
        +'.cp-banner-info{flex:1;}'
        +'.cp-banner-title{font-size:13px;font-weight:700;color:#111827;}'
        +'.cp-banner-detail{font-size:12px;color:#6B7280;margin-top:2px;line-height:1.4;}'
        +'.cp-banner-btn{padding:7px 14px;border-radius:999px;font-size:12px;font-weight:600;font-family:inherit;cursor:pointer;border:1.5px solid #3B82F6;background:#fff;color:#1D4ED8;white-space:nowrap;transition:background .15s;}'
        +'.cp-banner-btn:hover{background:#EFF6FF;}'+(banner.pulse||'');
      document.head.appendChild(styleEl);
      var el = document.createElement('div');
      el.className = 'cp-banner';
      el.style.cssText = 'background:'+banner.bg+';border-color:'+banner.border+';';
      el.innerHTML = '<div class="cp-banner-dot" style="background:'+banner.dot+(est==='revision'?';animation:cp-pulse-b 2s infinite':'')+';"></div>'
        +'<div class="cp-banner-info"><div class="cp-banner-title">'+escaparHTML(banner.title)+'</div><div class="cp-banner-detail">'+escaparHTML(banner.detail)+'</div></div>'
        +(banner.btn?'<button class="cp-banner-btn" onclick="location.href=\''+banner.href+'\'">'+banner.btn+'</button>':'');
      var main = document.getElementById('main');
      if (main) main.insertAdjacentElement('afterbegin', el);
    } catch(e) {}

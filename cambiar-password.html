<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cambiar contraseña — MIR COMAPA Sur</title>
  <script src="session.js"></script>
  <script src="guardia.js"></script>
  <script src="vistas-mir.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shared.css">
  <link rel="stylesheet" href="login.css">
  <style>
    /* Sin el carrusel del login: la tarjeta sola, centrada */
    body { background: var(--color-neutral-50, #F9FAFB); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box; }
    .login-card { position: static; width: 100%; max-width: 400px; max-height: none; }
  </style>
</head>
<body>
  <div class="login-card">
    <p class="login-system">MIR COMAPA Sur</p>
    <h1 class="login-title">Cambia tu contraseña</h1>
    <p class="login-sub" id="subtitulo">Por seguridad, antes de continuar reemplaza la contraseña temporal por una propia.</p>

    <div class="error-box hidden" id="errorBox" role="alert"><span id="errorMsg"></span></div>

    <form id="formPassword" novalidate>
      <div class="form-group">
        <label class="form-label" for="actual">Contraseña actual (la temporal)</label>
        <input class="form-input" type="password" id="actual" autocomplete="current-password">
      </div>
      <div class="form-group">
        <label class="form-label" for="nueva">Nueva contraseña</label>
        <input class="form-input" type="password" id="nueva" autocomplete="new-password" minlength="12">
        <p class="field-error" style="color:var(--color-text-secondary)">Al menos 12 caracteres.</p>
      </div>
      <div class="form-group">
        <label class="form-label" for="confirmar">Confirma la nueva contraseña</label>
        <input class="form-input" type="password" id="confirmar" autocomplete="new-password">
      </div>
      <button type="submit" id="btnGuardar" class="btn-login"><span id="btnText">Guardar contraseña</span></button>
    </form>

    <p class="page-footer"><a href="#" class="forgot-link" onclick="cerrarSesion(); return false;">Cerrar sesión</a></p>
  </div>
  <script src="cambiar-password.js"></script>
</body>
</html>

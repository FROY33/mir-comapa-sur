<style>
*,*::before,*::after {margin:0;padding:0;box-sizing:border-box;}
body {font-family:'Plus Jakarta Sans',sans-serif;background:var(--color-surface);color:var(--color-text-primary);display:flex;min-height:100vh;}
/* ── BREADCRUMB ── */
.breadcrumb {display:flex;align-items:center;gap:6px;margin-bottom:16px;}
.breadcrumb a {font-size:12px;font-weight:500;color:var(--color-text-secondary);text-decoration:none;transition:color .15s;}
.breadcrumb a:hover {color:var(--color-primary);}
.breadcrumb .sep {font-size:12px;color:var(--color-border);}
.breadcrumb .current {font-size:12px;font-weight:700;color:var(--color-text-primary);}
/* ── INDICATOR HEADER CARD ── */
.ind-header {background:var(--color-bg);border-radius:var(--radius-card);padding:24px var(--pad-card);box-shadow:0 1px 3px rgba(0,0,0,.06);margin-bottom:var(--gap);border-top:3px solid var(--color-primary);}
.ind-meta-row {display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:10px;}
.ind-id {font-size:11px;font-weight:700;font-family:monospace;color:var(--color-text-secondary);background:var(--color-surface);padding:4px 10px;border-radius:8px;}
.ind-title {font-size:20px;font-weight:700;color:var(--color-text-primary);line-height:1.4;margin-bottom:14px;max-width:700px;}
.ind-back-row {display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
/* ── BADGES ── */
.level-tag {font-size:10px;font-weight:600;padding:3px 8px;border-radius:var(--radius-btn);white-space:nowrap;display:inline-block;}
.level-tag.fin {background:var(--color-text-primary);color:white;}
.level-tag.proposito {background:var(--color-text-primary);color:white;}
.level-tag.componente {background:var(--color-text-secondary);color:white;}
.level-tag.actividad {background:var(--color-text-muted);color:white;}
.freq-tag {font-size:10px;font-weight:500;padding:3px 8px;border-radius:var(--radius-btn);white-space:nowrap;background:var(--color-neutral-100);color:var(--color-text-secondary);display:inline-block;}
.g-chip {font-size:10px;font-weight:600;padding:3px 8px;border-radius:var(--radius-btn);white-space:nowrap;background:var(--color-neutral-100);color:var(--color-text-secondary);display:inline-block;}
.sem-badge {display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:4px 11px;border-radius:var(--radius-btn);}
.sem-badge .dot {width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.forzado-tag {display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;color:var(--color-warning-dark);background:var(--color-warning-tint);padding:3px 8px;border-radius:var(--radius-btn);}
.forzado-tag svg {width:11px;height:11px;}
/* ── SUMMARY STRIP ── */
.summary-strip {display:grid;grid-template-columns:repeat(4,1fr);gap:var(--gap);margin-bottom:var(--gap);}
.sum-card {background:var(--color-bg);border-radius:var(--radius-card);padding:16px var(--pad-card);box-shadow:0 1px 3px rgba(0,0,0,.06);}
.sum-label {font-size:10px;font-weight:600;color:var(--color-text-secondary);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px;}
.sum-value {font-size:18px;font-weight:700;color:var(--color-text-primary);line-height:1;margin-bottom:4px;}
.sum-sub {font-size:11px;color:var(--color-text-secondary);}
/* ── TABS ── */
.tab-strip {display:flex;gap:4px;background:var(--color-bg);border-radius:var(--radius-card);padding:5px;box-shadow:0 1px 3px rgba(0,0,0,.06);margin-bottom:var(--gap);}
.tab-btn {flex:1;padding:8px 12px;border-radius:var(--radius-btn);border:none;background:transparent;font-family:inherit;font-size:12px;font-weight:600;color:var(--color-text-secondary);cursor:pointer;transition:all .15s;white-space:nowrap;text-align:center;}
.tab-btn:hover {background:var(--color-surface);color:var(--color-text-primary);}
.tab-btn.active {background:var(--color-primary);color:white;}
.tab-panel {display:none;}
.tab-panel.active {display:flex;flex-direction:column;gap:var(--gap);}
.section-title {font-size:13px;font-weight:700;color:var(--color-text-primary);margin-bottom:16px;display:flex;align-items:center;gap:8px;}
.section-title svg {width:16px;height:16px;color:var(--color-primary);flex-shrink:0;}
.field-row {display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.field {display:flex;flex-direction:column;gap:5px;}
.field-label {font-size:10px;font-weight:600;color:var(--color-text-secondary);text-transform:uppercase;letter-spacing:.05em;}
.field-value {font-size:13px;color:var(--color-text-primary);line-height:1.5;}
/* ── OBJ / FORMULA BLOCKS ── */
.obj-highlight {background:var(--color-primary-tint);border-radius:12px;padding:16px;}
.obj-highlight p {font-size:13px;font-weight:600;color:var(--color-primary);line-height:1.6;}
.formula-block {background:var(--color-surface);border-radius:12px;padding:16px;}
.formula-text {font-family:monospace;font-size:13px;color:var(--color-text-primary);line-height:1.7;}
.formula-label {font-size:10px;font-weight:600;color:var(--color-text-secondary);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px;}
.num-den-grid {display:grid;grid-template-columns:1fr 40px 1fr;gap:0;align-items:center;margin-top:4px;}
.nd-item {background:var(--color-surface);border-radius:12px;padding:14px 16px;}
.nd-label {font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;display:block;}
.nd-label.num {color:var(--color-text-primary);}
.nd-label.den {color:var(--color-text-secondary);}
.nd-value {font-size:12px;color:var(--color-text-primary);line-height:1.5;}
.nd-operator {text-align:center;font-size:22px;font-weight:700;color:var(--color-text-secondary);}
/* ── AVANCE DISPLAY ── */
.avance-big {display:flex;align-items:flex-end;gap:20px;flex-wrap:wrap;}
.avance-big-num {font-size:56px;font-weight:700;line-height:1;}
.avance-big-num.verde {color:var(--color-success);}
.avance-big-num.amarillo {color:var(--color-warning-dark);}
.avance-big-num.rojo {color:var(--color-danger);}
.avance-big-num.nd {color:var(--color-text-muted);font-size:32px;}
.avance-big-label {font-size:14px;color:var(--color-text-secondary);margin-bottom:10px;}
.avance-original {font-size:13px;color:var(--color-text-muted);text-decoration:line-through;margin-top:4px;}
.avance-acum-block {background:var(--color-surface);border-radius:12px;padding:14px 18px;margin-top:8px;}
.avance-acum-num {font-size:24px;font-weight:700;color:var(--color-text-secondary);}
.avance-acum-lbl {font-size:11px;color:var(--color-text-secondary);margin-top:2px;}
.no-corte-notice {background:var(--color-neutral-50);border:1px dashed var(--color-border);border-radius:12px;padding:20px;text-align:center;color:var(--color-text-secondary);font-size:13px;}
/* ── RANGOS FORM ── */
.rangos-form {background:var(--color-surface);border-radius:12px;padding:16px;border:1px solid var(--color-border);}
.rangos-row {display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap;margin-bottom:14px;}
.rangos-field {display:flex;flex-direction:column;gap:5px;min-width:120px;}
.rangos-input {background:var(--color-bg);border:1.5px solid var(--color-border);border-radius:10px;padding:8px 12px;font-family:inherit;font-size:14px;font-weight:700;color:var(--color-text-primary);outline:none;width:110px;transition:border-color .15s;}
.rangos-input:focus {border-color:var(--color-primary);}
.rangos-visual {display:flex;gap:2px;margin-bottom:12px;border-radius:8px;overflow:hidden;height:8px;}
.rangos-seg.verde {background:var(--color-success);flex:1;}
.rangos-seg.amarillo {background:var(--color-warning);flex:1;}
.rangos-seg.rojo {background:var(--color-danger);flex:1;}
.rangos-save-msg {display:none;align-items:center;gap:6px;background:var(--color-success-tint);border:1px solid #BBF7D0;border-radius:8px;padding:8px 12px;font-size:12px;font-weight:600;color:var(--color-success-dark);}
.rangos-save-msg svg {width:13px;height:13px;}
/* ── ACTIONS / FORMS ── */
.action-section {display:flex;flex-direction:column;gap:10px;}
.action-label {font-size:12px;font-weight:700;color:var(--color-text-primary);margin-bottom:2px;}
.action-sub {font-size:11px;color:var(--color-text-secondary);line-height:1.5;margin-bottom:4px;}
.action-textarea {width:100%;background:var(--color-bg);border:1.5px solid var(--color-border);border-radius:10px;padding:10px 14px;font-family:inherit;font-size:13px;color:var(--color-text-primary);resize:vertical;min-height:80px;outline:none;transition:border-color .15s;}
.action-textarea:focus {border-color:var(--color-primary);}
.action-input {background:var(--color-bg);border:1.5px solid var(--color-border);border-radius:10px;padding:9px 14px;font-family:inherit;font-size:15px;font-weight:700;color:var(--color-text-primary);outline:none;width:140px;transition:border-color .15s;}
.action-input:focus {border-color:var(--color-primary);}
.action-input-row {display:flex;align-items:center;gap:8px;}
.action-unit {font-size:16px;font-weight:700;color:var(--color-text-secondary);}
.action-validation-msg {font-size:11px;color:var(--color-danger);font-weight:600;display:none;margin-top:4px;}
.action-confirm {display:none;align-items:center;gap:7px;padding:9px 13px;border-radius:8px;font-size:12px;font-weight:600;margin-top:6px;}
.action-confirm.success {background:var(--color-success-tint);border:1px solid #BBF7D0;color:var(--color-success-dark);}
.action-confirm.danger {background:var(--color-observado-tint);border:1px solid var(--color-observado-tint);color:var(--color-observado);}
.action-confirm svg {width:14px;height:14px;flex-shrink:0;}
.blocked-notice {display:flex;align-items:flex-start;gap:10px;background:var(--color-observado-tint);border:1px solid var(--color-observado-tint);border-radius:12px;padding:14px 16px;font-size:13px;color:var(--color-observado);line-height:1.5;}
.blocked-notice svg {width:16px;height:16px;flex-shrink:0;margin-top:1px;}
/* ── HISTORIAL TIMELINE ── */
.hist-entry {display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--color-border);}
.hist-entry:last-child {border-bottom:none;}
.hist-dot {width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.hist-dot svg {width:14px;height:14px;}
.hist-dot.regresado_correccion {background:var(--color-observado-tint);color:var(--color-observado);}
.hist-dot.forzar_estado {background:var(--color-warning-tint);color:var(--color-warning-dark);}
.hist-dot.validar {background:var(--color-success-tint);color:var(--color-success-strong);}
.hist-dot.reabrir_periodo {background:var(--color-info-tint);color:var(--color-info);}
.hist-dot.agregar_observacion {background:var(--color-neutral-100);color:var(--color-text-secondary);}
.hist-meta {flex:1;}
.hist-action {font-size:12px;font-weight:700;color:var(--color-text-primary);}
.hist-user {font-size:11px;color:var(--color-text-secondary);margin-top:2px;}
.hist-comment {font-size:12px;color:var(--color-text-primary);margin-top:5px;line-height:1.5;background:var(--color-surface);border-radius:8px;padding:7px 10px;}
.hist-date {font-size:10px;font-weight:600;color:var(--color-text-secondary);white-space:nowrap;flex-shrink:0;margin-top:2px;}
.hist-empty {text-align:center;padding:24px;color:var(--color-text-secondary);font-size:13px;}
/* ── PLANEACIÓN ── */
.meta-visual {display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.meta-item {background:var(--color-surface);border-radius:12px;padding:16px;text-align:center;}
.meta-num {font-size:32px;font-weight:700;color:var(--color-text-primary);line-height:1;margin-bottom:4px;}
.meta-num.accent {color:var(--color-primary);}
.meta-lbl {font-size:11px;color:var(--color-text-secondary);}
/* ── INFO BLOCK ── */
.info-block {background:#F8F8F8;border:1px solid var(--color-border);border-radius:12px;padding:11px 14px;display:flex;align-items:flex-start;gap:9px;}
.info-block svg {width:14px;height:14px;color:var(--color-text-muted);flex-shrink:0;margin-top:1px;}
.info-block p {font-size:11px;color:var(--color-text-secondary);line-height:1.5;}
/* ── PENDING / RESPONSIVE ── */
.pending-tag {display:inline-flex;align-items:center;gap:5px;background:var(--color-neutral-100);color:var(--color-text-secondary);font-size:11px;font-weight:600;padding:4px 10px;border-radius:var(--radius-btn);}
@media(max-width:1024px) {
.summary-strip {grid-template-columns:repeat(2,1fr);}
.tab-btn {font-size:11px;padding:7px 8px;}
}

@media(max-width:860px) {
.field-row {grid-template-columns:1fr;}
.num-den-grid {grid-template-columns:1fr;}
.nd-operator {display:none;}
}
</style>

    <a class="nav-item" href="configuracion.html" title="Configuración">
      <svg fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.325.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 0 1 1.37.49l1.296 2.247a1.125 1.125 0 0 1-.26 1.431l-1.003.827c-.293.241-.438.613-.43.992a7.723 7.723 0 0 1 0 .255c-.008.378.137.75.43.991l1.004.827c.424.35.534.955.26 1.43l-1.298 2.247a1.125 1.125 0 0 1-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.47 6.47 0 0 1-.22.128c-.331.183-.581.495-.644.869l-.213 1.281c-.09.543-.56.94-1.11.94h-2.594c-.55 0-1.019-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 0 1-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 0 1-1.369-.49l-1.297-2.247a1.125 1.125 0 0 1 .26-1.431l1.004-.827c.292-.24.437-.613.43-.991a6.932 6.932 0 0 1 0-.255c.007-.38-.138-.751-.43-.992l-1.004-.827a1.125 1.125 0 0 1-.26-1.43l1.297-2.247a1.125 1.125 0 0 1 1.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.086.22-.128.332-.183.582-.495.644-.869l.214-1.28Z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"/></svg>

<!-- ── MAIN ── -->
<div class="app-wrapper">
<main class="main-content" id="mainContent"></main>
</div>

<script>
(function () {

  // ── AUTH ──────────────────────────────────────────────────────────────────
  var _user = Session.requireAuth();
  if (!_user) return;
  if (_user.rol !== 'Administrador') { window.location.href = 'dashboard-admin.html'; return; }

  var _initials = (_user.nombre || 'LS').split(' ').map(function(w){return w[0];}).join('').substring(0,2).toUpperCase();
  document.getElementById('avatarEl').textContent = _initials;

  // ── URL PARAMS ────────────────────────────────────────────────────────────
  var _params  = new URLSearchParams(window.location.search);
  var _indId   = _params.get('id')     || '';
  var _periodo = _params.get('periodo')|| ValidationAdminStore.DEMO_PERIODO;
  var _gerId   = _params.get('ger')    || '';

  // ── DATA ──────────────────────────────────────────────────────────────────
  var _d   = null; // ValidationAdminStore.getIndicadorDetalle result
  var _act = null; // raw ACTIVIDADES_ENLACE entry for full metadata

  function _refresh() {
    _d   = ValidationAdminStore.getIndicadorDetalle(_indId, _periodo);
    _act = (typeof ACTIVIDADES_ENLACE !== 'undefined')
      ? ACTIVIDADES_ENLACE.find(function(x){ return x.id === _indId; }) || null
      : null;
  }

  _refresh();

  if (!_d) {
    document.getElementById('mainContent').innerHTML =
      '<p style="padding:48px 24px;color:var(--color-text-secondary);text-align:center">Indicador no encontrado: ' + _indId + '</p>';
    return;
  }

  document.title = _d.indicador.nombre.substring(0, 60) + ' — Validación · MIR COMAPA Sur';

  // ── CONSTANTS ─────────────────────────────────────────────────────────────
  var MESES_ES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  function _perLabel(p) { var m=parseInt(p.slice(5),10); var y=p.slice(0,4); return MESES_ES[m-1]+' '+y; }

  var SEM_COLOR = { verde:'#22C55E', amarillo:'#F59E0B', rojo:'#EF4444', nd:'#9CA3AF' };
  var SEM_BG    = { verde:'#F0FDF4', amarillo:'#FEF3C7', rojo:'#FEF2F2', nd:'#F9FAFB' };
  var SEM_LABEL = { verde:'Cumplimiento', amarillo:'Con alerta', rojo:'Incumplimiento', nd:'Sin datos' };

  var HIST_LABEL = {
    validar:           'Período validado',
    regresar_correccion: 'Regresado a corrección',
    forzar_estado:     'Valor forzado por administrador',
    reabrir_periodo:   'Período reabierto',
    agregar_observacion: 'Observación agregada',
  };

  var NIVEL_CLS = { Fin:'fin', Propósito:'proposito', Componente:'componente', Actividad:'actividad' };
  function _lvCls(n) { return NIVEL_CLS[n]||'actividad'; }
  function _frCls(f) { return ({Mensual:'mensual',Trimestral:'trimestral',Semestral:'semestral',Anual:'anual',Bimestral:'bimestral'})[f]||''; }

  function pend(v) {
    if (v !== null && v !== undefined && v !== '') return String(v);
    return '<span class="pending-tag"><svg fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" width="11" height="11"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/></svg>Pendiente de captura</span>';
  }

  // ── RENDER MAIN ───────────────────────────────────────────────────────────
  function renderAll() {
    _refresh();
    var d   = _d;
    var act = _act;
    var ind = d.indicador;
    var r   = d.reporte;

    var perLabel = _perLabel(_periodo);
    var gerName  = d.gerencia ? d.gerencia.nombre : ind.gerenciaId;
    var backUrl  = 'validacion-gerencia-detalle.html?ger=' + _gerId + '&periodo=' + _periodo;
    var sem      = d.semaforo;

    // Summary strip: Frecuencia, Unidad, Meta, Semáforo
    var metaVal = act && act.metaAnual !== null ? act.metaAnual : null;
    var uMedida = ind.unidadMedida || (act && act.unidadMedida) || '—';
    var frecN   = ({Mensual:'12',Trimestral:'4',Semestral:'2',Anual:'1',Bimestral:'6'})[ind.frecuencia]||'—';

    var sumSem = '<div class="sum-card" style="border-top:3px solid '+SEM_COLOR[sem]+'">'
      + '<p class="sum-label">Semáforo</p>'
      + '<div style="margin:8px 0">'
      + '  <span class="sem-badge" style="background:'+SEM_BG[sem]+';color:'+SEM_COLOR[sem]+'">'
      + '    <span class="dot" style="background:'+SEM_COLOR[sem]+'"></span>'+SEM_LABEL[sem]
      + '  </span></div>'
      + '<p class="sum-sub">' + perLabel + '</p>'
      + '</div>';

    // Period label for back link
    var backLabel = _gerId
      ? ('Volver a ' + (_d.gerencia ? _d.gerencia.nombre.replace('Gerencia de ','') : _gerId))
      : 'Volver a gerencia';

    var html = ''
      + '<div class="breadcrumb">'
      +   '<a href="validacion-admin-dashboard.html">Inicio</a>'
      +   '<span class="sep">›</span>'
      +   '<a href="validacion-admin-dashboard.html">Validación</a>'
      +   '<span class="sep">›</span>'
      +   '<a href="' + backUrl + '">' + gerName.replace('Gerencia de ','') + '</a>'
      +   '<span class="sep">›</span>'
      +   '<span class="current">' + ind.id + '</span>'
      + '</div>'

      + '<div class="ind-header" style="border-top-color:' + (d.gerencia ? d.gerencia.color : 'var(--color-primary)') + '">'
      +   '<div class="ind-meta-row">'
      +     '<span class="ind-id">' + ind.id + '</span>'
      +     '<span class="level-tag ' + _lvCls(ind.nivel||'Actividad') + '">' + (ind.nivel||'Actividad') + '</span>'
      +     '<span class="g-chip">' + gerName + '</span>'
      +     '<span class="freq-tag ' + _frCls(ind.frecuencia) + '">' + ind.frecuencia + '</span>'
      +     (r && r.valorForzado ? '<span class="forzado-tag"><svg fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="m16.862 4.487 1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L10.582 16.07a4.5 4.5 0 0 1-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 0 1 1.13-1.897l8.932-8.931Zm0 0L19.5 7.125"/></svg>Ajustado por administrador</span>' : '')
      +   '</div>'
      +   '<h1 class="ind-title">' + ind.nombre + '</h1>'
      +   '<div class="ind-back-row">'
      +     '<a class="btn btn-ghost" href="' + backUrl + '">'
      +       '<svg fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18"/></svg>'
      +       backLabel
      +     '</a>'
      +     '<span style="font-size:12px;color:var(--color-text-secondary);">Período: <strong>' + perLabel + '</strong></span>'
      +   '</div>'
      + '</div>'

      + '<div class="summary-strip">'
      +   '<div class="sum-card"><p class="sum-label">Frecuencia</p><p class="sum-value" style="font-size:14px">' + ind.frecuencia + '</p><p class="sum-sub">' + frecN + ' reporte' + (frecN!=='1'?'s':'') + ' al año</p></div>'
      +   '<div class="sum-card"><p class="sum-label">Unidad de medida</p><p class="sum-value" style="font-size:16px">' + (uMedida==='Porcentaje'?'%':uMedida) + '</p><p class="sum-sub">' + uMedida + '</p></div>'
      +   '<div class="sum-card"><p class="sum-label">Meta anual</p>' + (metaVal!==null?'<p class="sum-value" style="color:var(--color-primary)">'+metaVal+'</p>':'<div style="margin:8px 0">'+pend(null)+'</div>') + '<p class="sum-sub">' + (act&&act.lineaBase!==null?'Línea base: '+act.lineaBase:'Línea base pendiente') + '</p></div>'
      +   sumSem
      + '</div>'

      + '<div class="tab-strip">'
      +   _tabBtn('resumen',  'Resumen', true)
      +   _tabBtn('medicion', 'Medición')
      +   _tabBtn('avance',   'Avance')
      +   _tabBtn('plan',     'Planeación')
      +   _tabBtn('acciones', 'Acciones')
      + '</div>'

      + '<div class="tab-panel active" id="tab-resumen">'  + _tabResumen(d, act) + '</div>'
      + '<div class="tab-panel" id="tab-medicion">' + _tabMedicion(d, act) + '</div>'
      + '<div class="tab-panel" id="tab-avance">'   + _tabAvance(d) + '</div>'
      + '<div class="tab-panel" id="tab-plan">'     + _tabPlan(d, act) + '</div>'
      + '<div class="tab-panel" id="tab-acciones">' + _tabAcciones(d) + '</div>';

    document.getElementById('mainContent').innerHTML = html;

    // Tab switching
    document.querySelectorAll('.tab-btn').forEach(function(btn){
      btn.addEventListener('click', function(){
        var t = btn.dataset.tab;
        document.querySelectorAll('.tab-btn').forEach(function(b){b.classList.toggle('active',b===btn);});
        document.querySelectorAll('.tab-panel').forEach(function(p){p.classList.toggle('active',p.id==='tab-'+t);});
      });
    });
  }

  function _tabBtn(key, label, active) {
    return '<button class="tab-btn' + (active ? ' active' : '') + '" data-tab="' + key + '">' + label + '</button>';
  }

  // ── TAB: RESUMEN ──────────────────────────────────────────────────────────
  function _tabResumen(d, act) {
    var obj = (act && act.resumenNarrativo) || d.indicador.nombre;
    var gerName = d.gerencia ? d.gerencia.nombre : d.indicador.gerenciaId;
    return ''
      + '<div class="section-card">'
      +   '<p class="section-title"><svg fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/></svg>Objetivo del indicador</p>'
      +   '<div class="obj-highlight" style="margin-bottom:14px"><p>' + obj + '</p></div>'
      + '</div>'
      + '<div class="section-card">'
      +   '<p class="section-title"><svg fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6A2.25 2.25 0 0 1 6 3.75h2.25A2.25 2.25 0 0 1 10.5 6v2.25a2.25 2.25 0 0 1-2.25 2.25H6a2.25 2.25 0 0 1-2.25-2.25V6Z"/></svg>Ubicación en la MIR</p>'
      +   '<div class="field-row">'
      +     '<div class="field"><span class="field-label">Gerencia</span><span class="field-value"><span class="g-chip">' + gerName + '</span></span></div>'
      +     '<div class="field"><span class="field-label">Nivel MIR</span><span class="field-value"><span class="level-tag ' + _lvCls(d.indicador.nivel||'Actividad') + '">' + (d.indicador.nivel||'Actividad') + '</span></span></div>'
      +     '<div class="field"><span class="field-label">Unidad responsable</span><span class="field-value">' + (d.unidad ? d.unidad.nombre : pend(null)) + '</span></div>'
      +     '<div class="field"><span class="field-label">Revisor asignado</span><span class="field-value">' + (d.revisor ? d.revisor.nombre : pend(null)) + '</span></div>'
      +     '<div class="field"><span class="field-label">Enlace asignado</span><span class="field-value">' + (d.enlace ? d.enlace.nombre : pend(null)) + '</span></div>'
      +   '</div>'
      + '</div>';
  }

  // ── TAB: MEDICIÓN ─────────────────────────────────────────────────────────
  function _tabMedicion(d, act) {
    var ind = d.indicador;
    var tieneDen = act ? (act.denominador && act.denominador !== '') : false;
    var numDenHTML;
    if (tieneDen) {
      numDenHTML = '<div class="num-den-grid">'
        + '<div class="nd-item"><span class="nd-label num">Numerador (X)</span><p class="nd-value">' + (act.numerador||'No especificado') + '</p></div>'
        + '<div class="nd-operator">÷</div>'
        + '<div class="nd-item"><span class="nd-label den">Denominador (Y)</span><p class="nd-value">' + (act.denominador||'No especificado') + '</p></div>'
        + '</div>';
    } else {
      numDenHTML = '<div class="nd-item"><span class="nd-label num">Variable (X)</span><p class="nd-value">' + (act && act.numerador ? act.numerador : 'No especificado') + '</p></div>';
    }
    var frecN = ({Mensual:'12',Trimestral:'4',Semestral:'2',Anual:'1',Bimestral:'6'})[ind.frecuencia]||'—';
    return ''
      + '<div class="section-card">'
      +   '<p class="section-title"><svg fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 15.75V18m-7.5-6.75h.008v.008H8.25v-.008Zm0 2.25h.008v.008H8.25V13.5Zm0 2.25h.008v.008H8.25v-.008Zm0 2.25h.008v.008H8.25V18Zm2.498-6.75h.007v.008h-.007v-.008Zm0 2.25h.007v.008h-.007V13.5Zm0 2.25h.007v.008h-.007v-.008Zm0 2.25h.007v.008h-.007V18Zm2.504-6.75h.008v.008h-.008v-.008Zm0 2.25h.008v.008h-.008V13.5Z"/></svg>Método de cálculo</p>'
      +   '<div class="formula-block"><p class="formula-label">Fórmula / variable principal</p><p class="formula-text">' + pend(act && act.numerador) + '</p></div>'
      +   '<div class="divider" style="margin:20px 0"></div>'
      +   '<p class="field-label" style="margin-bottom:12px">Variables del cálculo</p>'
      +   numDenHTML
      +   '<div class="divider" style="margin:20px 0"></div>'
      +   '<div class="field-row">'
      +     '<div class="field"><span class="field-label">Unidad de medida</span><span class="field-value">' + pend(ind.unidadMedida) + '</span></div>'
      +     '<div class="field"><span class="field-label">Frecuencia de medición</span><span class="field-value"><span class="freq-tag ' + _frCls(ind.frecuencia) + '">' + ind.frecuencia + '</span> <span style="font-size:11px;color:var(--color-text-secondary);margin-left:4px">→ ' + frecN + ' reporte' + (frecN!=='1'?'s':'') + ' al año</span></span></div>'
      +     '<div class="field"><span class="field-label">Aplica acumulado</span><span class="field-value">' + (ind.aplicaAcumulado ? 'Sí — se mide avance acumulado' : 'No — solo valor del período') + '</span></div>'
      +   '</div>'
      + '</div>';
  }

  // ── TAB: AVANCE ───────────────────────────────────────────────────────────
  function _tabAvance(d) {
    var ind = d.indicador;
    var r   = d.reporte;
    var sem = d.semaforo;
    var hc  = d.hasCorte;

    var avanceSection;
    if (!hc) {
      avanceSection = '<div class="no-corte-notice">'
        + '<svg fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" width="20" height="20" style="margin:0 auto 8px;display:block;color:var(--color-text-muted)"><path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 0 1 2.25-2.25h13.5A2.25 2.25 0 0 1 21 7.5v11.25m-18 0A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75m-18 0v-7.5A2.25 2.25 0 0 1 5.25 9h13.5A2.25 2.25 0 0 1 21 11.25v7.5"/></svg>'
        + 'Este indicador no tiene corte de reporte en ' + _perLabel(_periodo) + '.<br>'
        + '<small style="font-size:11px">Frecuencia <strong>' + ind.frecuencia + '</strong> — el próximo corte corresponde a un período posterior.</small>'
        + '</div>';
    } else {
      var avancePct = (r && r.avancePeriodo !== null && r.avancePeriodo !== undefined) ? r.avancePeriodo : null;
      var forzado   = r && r.valorForzado;
      var origVal   = r && r.valorOriginal;

      var bigNum, bigCls;
      if (avancePct === null) { bigNum = 'Sin dato'; bigCls = 'nd'; }
      else { bigNum = avancePct + '%'; bigCls = sem; }

      avanceSection = '<div class="avance-big">'
        + '<div>'
        +   '<div class="avance-big-num ' + bigCls + '">' + bigNum + '</div>'
        +   '<div class="avance-big-label">avance en ' + _perLabel(_periodo) + '</div>'
        +   (forzado ? '<div class="avance-original">Original: ' + origVal + '% <em style="font-size:10px">(valor reportado por el enlace)</em></div>' : '')
        + '</div>'
        + '<div>'
        +   '<span class="sem-badge" style="background:' + SEM_BG[sem] + ';color:' + SEM_COLOR[sem] + '">'
        +     '<span class="dot" style="background:' + SEM_COLOR[sem] + '"></span>'
        +     SEM_LABEL[sem]
        +   '</span>'
        +   (forzado ? '<div style="margin-top:8px"><span class="forzado-tag"><svg fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="m16.862 4.487 1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L10.582 16.07a4.5 4.5 0 0 1-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 0 1 1.13-1.897l8.932-8.931Zm0 0L19.5 7.125"/></svg>Ajustado por administrador</span></div>' : '')
        + '</div>'
        + '</div>';

      if (ind.aplicaAcumulado && r) {
        var acumVal = (r.avanceAcumulado !== null && r.avanceAcumulado !== undefined) ? r.avanceAcumulado + '%' : 'Sin datos';
        avanceSection += '<div class="avance-acum-block">'
          + '<div class="avance-acum-lbl">Avance acumulado del ejercicio</div>'
          + '<div class="avance-acum-num">' + acumVal + '</div>'
          + '</div>';
      }
    }

    // Rangos config
    var vMin = ind.rangosSemaforo ? ind.rangosSemaforo.verdeMin   : 95;
    var aMin = ind.rangosSemaforo ? ind.rangosSemaforo.amarilloMin : 80;

    var rangosSection = '<div class="section-card">'
      + '<p class="section-title"><svg fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M10.5 6h9.75M10.5 6a1.5 1.5 0 1 1-3 0m3 0a1.5 1.5 0 1 0-3 0M3.75 6H7.5m3 12h9.75m-9.75 0a1.5 1.5 0 0 1-3 0m3 0a1.5 1.5 0 0 0-3 0m-3.75 0H7.5m9-6h3.75m-3.75 0a1.5 1.5 0 0 1-3 0m3 0a1.5 1.5 0 0 0-3 0m-9.75 0h9.75"/></svg>Configuración de rangos de semáforo</p>'
      + '<div class="rangos-form">'
      +   '<p style="font-size:11px;color:var(--color-text-secondary);margin-bottom:12px">Configura los umbrales de cumplimiento para este indicador. El semáforo se recalcula automáticamente al guardar.</p>'
      +   '<div class="rangos-row">'
      +     '<div class="rangos-field"><label class="field-label" style="color:var(--color-success)">Verde ≥</label><div style="display:flex;align-items:center;gap:4px"><input class="rangos-input" id="rangoVerde" type="number" min="1" max="100" value="' + vMin + '"><span style="font-weight:700">%</span></div></div>'
      +     '<div class="rangos-field"><label class="field-label" style="color:var(--color-warning-dark)">Amarillo ≥</label><div style="display:flex;align-items:center;gap:4px"><input class="rangos-input" id="rangoAmarillo" type="number" min="1" max="100" value="' + aMin + '"><span style="font-weight:700">%</span></div></div>'
      +     '<div class="rangos-field"><label class="field-label" style="color:var(--color-danger)">Rojo</label><div style="padding:8px 12px;font-size:13px;font-weight:700;color:var(--color-danger)">< <span id="rojoMin">' + aMin + '</span>%</div></div>'
      +   '</div>'
      +   '<div class="rangos-visual"><div class="rangos-seg verde"></div><div class="rangos-seg amarillo"></div><div class="rangos-seg rojo"></div></div>'
      +   '<p style="font-size:10px;color:var(--color-text-secondary);margin-bottom:12px">Verde ≥ ' + vMin + '% · Amarillo ' + aMin + '–' + (vMin-0.1).toFixed(1) + '% · Rojo < ' + aMin + '%</p>'
      +   '<div style="display:flex;align-items:center;gap:10px">'
      +     '<button class="btn btn-secondary" style="font-size:12px" onclick="_guardarRangos()">Guardar configuración</button>'
      +     '<div class="rangos-save-msg" id="rangosSaveMsg"><svg fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/></svg>Configuración guardada</div>'
      +   '</div>'
      + '</div>'
      + '</div>';

    return '<div class="section-card">'
      + '<p class="section-title"><svg fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M3 13.125C3 12.504 3.504 12 4.125 12h2.25c.621 0 1.125.504 1.125 1.125v6.75C7.5 20.496 6.996 21 6.375 21h-2.25A1.125 1.125 0 0 1 3 19.875v-6.75ZM9.75 8.625c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125v11.25c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 0 1-1.125-1.125V8.625ZM16.5 4.125c0-.621.504-1.125 1.125-1.125h2.25C20.496 3 21 3.504 21 4.125v15.75c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 0 1-1.125-1.125V4.125Z"/></svg>Avance del período</p>'
      + avanceSection
      + '</div>'
      + rangosSection;
  }

  // ── TAB: PLANEACIÓN ───────────────────────────────────────────────────────
  function _tabPlan(d, act) {
    var lb  = act && act.lineaBase  !== null ? act.lineaBase  : null;
    var ma  = act && act.metaAnual  !== null ? act.metaAnual  : null;
    var sup = act && act.supuestos;
    var obs = act && act.observacionesMIR;
    return ''
      + '<div class="section-card">'
      +   '<p class="section-title"><svg fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M3 13.125C3 12.504 3.504 12 4.125 12h2.25c.621 0 1.125.504 1.125 1.125v6.75C7.5 20.496 6.996 21 6.375 21h-2.25A1.125 1.125 0 0 1 3 19.875v-6.75ZM9.75 8.625c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125v11.25c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 0 1-1.125-1.125V8.625ZM16.5 4.125c0-.621.504-1.125 1.125-1.125h2.25C20.496 3 21 3.504 21 4.125v15.75c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 0 1-1.125-1.125V4.125Z"/></svg>Línea base y meta anual</p>'
      +   '<div class="meta-visual">'
      +     '<div class="meta-item"><p class="meta-lbl" style="margin-bottom:8px">Línea base</p>' + (lb!==null?'<p class="meta-num">'+lb+'</p>':pend(null)) + '</div>'
      +     '<div class="meta-item"><p class="meta-lbl" style="margin-bottom:8px">Meta anual</p>' + (ma!==null?'<p class="meta-num accent">'+ma+'</p>':pend(null)) + '</div>'
      +   '</div>'
      + '</div>'
      + '<div class="section-card">'
      +   '<p class="section-title"><svg fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 18v-5.25m0 0a6.01 6.01 0 0 0 1.5-.189m-1.5.189a6.01 6.01 0 0 1-1.5-.189m3.75 7.478a12.06 12.06 0 0 1-4.5 0m3.75 2.383a14.406 14.406 0 0 1-3 0M14.25 18v-.192c0-.983.658-1.823 1.508-2.316a7.5 7.5 0 1 0-7.517 0c.85.493 1.509 1.333 1.509 2.316V18"/></svg>Supuestos</p>'
      +   (sup ? '<p class="field-value" style="line-height:1.7">' + sup + '</p>' : pend(null))
      + '</div>'
      + (obs ? '<div class="section-card"><p class="section-title">Observaciones MIR</p><p class="field-value" style="line-height:1.7">' + obs + '</p></div>' : '');
  }

  // ── TAB: ACCIONES ─────────────────────────────────────────────────────────
  function _tabAcciones(d) {
    var ind = d.indicador;
    var r   = d.reporte;
    var hc  = d.hasCorte;
    var isValidado = r && r.estado === 'validado';

    var blockedMsg = '';
    if (isValidado) {
      blockedMsg = '<div class="blocked-notice">'
        + '<svg fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 1 0-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 0 0 2.25-2.25v-6.75a2.25 2.25 0 0 0-2.25-2.25H6.75a2.25 2.25 0 0 0-2.25 2.25v6.75a2.25 2.25 0 0 0 2.25 2.25Z"/></svg>'
        + 'Este período ya fue <strong>validado</strong>. Las acciones de observación y forzar valor están deshabilitadas. Para realizar cambios, es necesario reabrir el período desde el panel de validación de gerencia (Bloque 5).'
        + '</div>';
    } else if (!hc) {
      blockedMsg = '<div class="blocked-notice" style="background:var(--color-neutral-50);border-color:var(--color-border);color:var(--color-text-secondary)">'
        + '<svg fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 0 1 2.25-2.25h13.5A2.25 2.25 0 0 1 21 7.5v11.25m-18 0A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75m-18 0v-7.5A2.25 2.25 0 0 1 5.25 9h13.5A2.25 2.25 0 0 1 21 11.25v7.5"/></svg>'
        + 'Este indicador no tiene corte de reporte en ' + _perLabel(_periodo) + '. Las acciones no están disponibles para períodos sin corte.'
        + '</div>';
    }

    var disabled = isValidado || !hc;
    var dis = disabled ? ' disabled' : '';

    var revisorNombre = d.revisor ? d.revisor.nombre : 'el revisor';
    var enlaceNombre  = d.enlace  ? d.enlace.nombre  : 'el enlace';

    var uMedida = ind.unidadMedida || '';
    var indUnit = uMedida === 'Porcentaje' ? '%' : '';
    var curAvance = (r && r.avancePeriodo !== null && r.avancePeriodo !== undefined) ? r.avancePeriodo : '';

    return ''
      + blockedMsg

      // Sección 1: Regresar a corrección
      + '<div class="section-card">'
      +   '<p class="section-title"><svg fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9 15 3 9m0 0 6-6M3 9h12a6 6 0 0 1 0 12h-3"/></svg>Dejar observación / solicitar corrección</p>'
      +   '<div class="action-section">'
      +     '<p class="action-sub">Escribe una observación para solicitar justificación o corrección. El indicador pasará a estado <strong>Regresado a corrección</strong> y se notificará al revisor (' + revisorNombre + ') y al enlace (' + enlaceNombre + ').</p>'
      +     '<textarea class="action-textarea" id="obsTextarea" placeholder="Describe la observación o el motivo de la corrección..." ' + (disabled ? 'disabled' : '') + '></textarea>'
      +     '<p class="action-validation-msg" id="obsValidMsg">El comentario es obligatorio para regresar a corrección.</p>'
      +     '<div><button class="btn btn-danger" id="btnRegresar" onclick="_handleRegresar()" ' + dis + '><svg fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9 15 3 9m0 0 6-6M3 9h12a6 6 0 0 1 0 12h-3"/></svg>Regresar a corrección</button></div>'
      +     '<div class="action-confirm" id="obsConfirm"><svg fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/></svg><span id="obsConfirmTxt"></span></div>'
      +   '</div>'
      + '</div>'

      // Sección 2: Forzar valor
      + '<div class="section-card">'
      +   '<p class="section-title"><svg fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="m16.862 4.487 1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L10.582 16.07a4.5 4.5 0 0 1-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 0 1 1.13-1.897l8.932-8.931Zm0 0L19.5 7.125"/></svg>Forzar valor de cumplimiento</p>'
      +   '<div class="action-section">'
      +     '<p class="action-sub">Sobrescribe el valor de avance reportado por el enlace. El valor original queda registrado en el historial con trazabilidad completa. El <strong>comentario es obligatorio</strong> para aplicar el override.</p>'
      +     (r && r.valorForzado ? '<div class="info-block" style="margin-bottom:4px"><svg fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="m11.25 11.25.041-.02a.75.75 0 0 1 1.063.852l-.708 2.836a.75.75 0 0 0 1.063.853l.041-.021M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9-3.75h.008v.008H12V8.25Z"/></svg><p>Ya existe un valor forzado: <strong>' + (r.avancePeriodo||'—') + indUnit + '</strong>. El valor original era <strong><s>' + r.valorOriginal + indUnit + '</s></strong>. Puedes aplicar un nuevo override; quedará registrado en el historial.</p></div>' : '')
      +     '<p class="action-label">Nuevo valor de avance</p>'
      +     '<div class="action-input-row" style="margin-bottom:10px">'
      +       '<input class="action-input" id="forzarInput" type="number" min="0" max="200" placeholder="Ej: 78" value="' + curAvance + '" ' + (disabled ? 'disabled' : '') + '>'
      +       (indUnit ? '<span class="action-unit">' + indUnit + '</span>' : '')
      +     '</div>'
      +     '<p class="action-label">Justificación / comentario</p>'
      +     '<textarea class="action-textarea" id="forzarTextarea" placeholder="Explica el motivo del ajuste..." ' + (disabled ? 'disabled' : '') + '></textarea>'
      +     '<p class="action-validation-msg" id="forzarValidMsg">El comentario es obligatorio para aplicar el override.</p>'
      +     '<div><button class="btn btn-primary" id="btnForzar" onclick="_handleForzar()" ' + dis + '><svg fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="m16.862 4.487 1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L10.582 16.07a4.5 4.5 0 0 1-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 0 1 1.13-1.897l8.932-8.931Zm0 0L19.5 7.125"/></svg>Aplicar override</button></div>'
      +     '<div class="action-confirm success" id="forzarConfirm"><svg fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/></svg><span id="forzarConfirmTxt"></span></div>'
      +   '</div>'
      + '</div>'

      // Sección 3: Historial
      + '<div class="section-card">'
      +   '<p class="section-title"><svg fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/></svg>Historial de acciones</p>'
      +   _renderHistorial(d.historial)
      + '</div>';
  }

  function _renderHistorial(hist) {
    if (!hist || !hist.length) {
      return '<div class="hist-empty"><svg fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" width="28" height="28" style="margin:0 auto 8px;display:block;opacity:.4"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/></svg>Sin acciones registradas en este período para este indicador.</div>';
    }
    return hist.map(function(h) {
      var accionKey = h.accion || 'agregar_observacion';
      var label     = HIST_LABEL[accionKey] || accionKey;
      var usuNombre = (h.usuarioId && ValidationAdminStore.getUsuario(h.usuarioId))
        ? ValidationAdminStore.getUsuario(h.usuarioId).nombre : h.usuarioId || '—';
      var fechaDisp = h.fecha || '';
      var svgMap = {
        regresar_correccion: '<path stroke-linecap="round" stroke-linejoin="round" d="M9 15 3 9m0 0 6-6M3 9h12a6 6 0 0 1 0 12h-3"/>',
        forzar_estado:       '<path stroke-linecap="round" stroke-linejoin="round" d="m16.862 4.487 1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L10.582 16.07a4.5 4.5 0 0 1-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 0 1 1.13-1.897l8.932-8.931Zm0 0L19.5 7.125"/>',
        validar:             '<path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/>',
        reabrir_periodo:     '<path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182m0-4.991v4.99"/>',
        agregar_observacion: '<path stroke-linecap="round" stroke-linejoin="round" d="M7.5 8.25h9m-9 3H12m-9.75 1.51c0 1.6 1.123 2.994 2.707 3.227 1.129.166 2.27.293 3.423.379.35.026.67.21.865.501L12 21l2.755-4.133a1.14 1.14 0 0 1 .865-.501 48.172 48.172 0 0 0 3.423-.379c1.584-.233 2.707-1.626 2.707-3.228V6.741c0-1.602-1.123-2.995-2.707-3.228A48.394 48.394 0 0 0 12 3c-2.392 0-4.744.175-7.043.513C3.373 3.746 2.25 5.14 2.25 6.741v6.018Z"/>',
      };
      var svg = svgMap[accionKey] || svgMap['agregar_observacion'];
      return '<div class="hist-entry">'
        + '<div class="hist-dot ' + accionKey + '"><svg fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">' + svg + '</svg></div>'
        + '<div class="hist-meta">'
        +   '<div class="hist-action">' + label + '</div>'
        +   '<div class="hist-user">' + usuNombre + '</div>'
        +   (h.comentario ? '<div class="hist-comment">' + h.comentario + '</div>' : '')
        + '</div>'
        + '<div class="hist-date">' + fechaDisp + '</div>'
        + '</div>';
    }).join('');
  }

  // ── ACTIONS ───────────────────────────────────────────────────────────────
  window._handleRegresar = function() {
    var comentario = (document.getElementById('obsTextarea')||{}).value || '';
    var validMsg   = document.getElementById('obsValidMsg');
    if (!comentario.trim()) {
      if (validMsg) validMsg.style.display = 'block';
      return;
    }
    if (validMsg) validMsg.style.display = 'none';

    var result = ValidationAdminStore.regresarACorreccion(_indId, _periodo, _user.id || 'adm-001', comentario.trim());
    var confirm = document.getElementById('obsConfirm');
    var confirmTxt = document.getElementById('obsConfirmTxt');
    if (result && result.ok) {
      if (confirm) { confirm.className = 'action-confirm success'; confirm.style.display = 'flex'; }
      if (confirmTxt) confirmTxt.textContent = 'Observación enviada. El indicador fue regresado a corrección. Se notificó a ' + (_d.revisor ? _d.revisor.nombre : 'el revisor') + ' y ' + (_d.enlace ? _d.enlace.nombre : 'el enlace') + '.';
      _refresh();
    } else {
      if (confirm) { confirm.className = 'action-confirm danger'; confirm.style.display = 'flex'; }
      if (confirmTxt) confirmTxt.textContent = 'Error: ' + ((result && result.error) || 'No se pudo aplicar la acción.');
    }
  };

  window._handleForzar = function() {
    var valorStr   = (document.getElementById('forzarInput')||{}).value || '';
    var comentario = (document.getElementById('forzarTextarea')||{}).value || '';
    var validMsg   = document.getElementById('forzarValidMsg');
    if (!comentario.trim()) {
      if (validMsg) validMsg.style.display = 'block';
      return;
    }
    if (validMsg) validMsg.style.display = 'none';

    var nuevoValor = parseFloat(valorStr);
    if (isNaN(nuevoValor)) { if (validMsg) { validMsg.textContent = 'Ingresa un valor numérico válido.'; validMsg.style.display = 'block'; } return; }

    var result = ValidationAdminStore.forzarEstadoIndicador(_indId, _periodo, _user.id || 'adm-001', nuevoValor, comentario.trim());
    var confirm = document.getElementById('forzarConfirm');
    var confirmTxt = document.getElementById('forzarConfirmTxt');
    if (result && result.ok) {
      if (confirm) { confirm.style.display = 'flex'; }
      if (confirmTxt) confirmTxt.textContent = 'Override aplicado. Valor forzado a ' + nuevoValor + '. El valor original queda registrado en el historial.';
      _refresh();
    } else {
      if (confirm) { confirm.className = 'action-confirm danger'; confirm.style.display = 'flex'; }
      if (confirmTxt) confirmTxt.textContent = 'Error: ' + ((result && result.error) || 'No se pudo aplicar el override.');
    }
  };

  window._guardarRangos = function() {
    var vMin = parseFloat((document.getElementById('rangoVerde')||{}).value);
    var aMin = parseFloat((document.getElementById('rangoAmarillo')||{}).value);
    if (isNaN(vMin) || isNaN(aMin) || aMin >= vMin || vMin > 100 || aMin < 1) {
      alert('Configuración inválida. Asegúrate que Amarillo < Verde y ambos estén entre 1 y 100.');
      return;
    }
    _d.indicador.rangosSemaforo = { verdeMin: vMin, amarilloMin: aMin };
    _refresh();
    var msg = document.getElementById('rangosSaveMsg');
    if (msg) msg.style.display = 'flex';
    setTimeout(function() { if (msg) msg.style.display = 'none'; }, 3000);
    var rojoMin = document.getElementById('rojoMin');
    if (rojoMin) rojoMin.textContent = aMin;
  };

  // ── INIT ──────────────────────────────────────────────────────────────────
  renderAll();

})();
</script>
<script src="dev-toolbar.js"></script>
</body>
</html>

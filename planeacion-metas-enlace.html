  <style>
*,*::before,*::after {margin:0;padding:0;box-sizing:border-box;}
body {font-family:'Plus Jakarta Sans',sans-serif;background:var(--color-surface);color:var(--color-text-primary);display:flex;min-height:100vh;}
.rp-user {display:flex;align-items:center;gap:10px;margin-bottom:16px;}
.rp-avatar {width:40px;height:40px;border-radius:50%;background:var(--color-primary);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:white;flex-shrink:0;}
.rp-name {font-size:13px;font-weight:700;}
.rp-role {font-size:11px;color:var(--color-text-secondary);margin-top:1px;}
.rp-stat-row {display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.rp-stat-label {font-size:12px;color:var(--color-text-primary);}
.rp-stat-val {font-size:12px;font-weight:700;}
.rp-badge {font-size:10px;font-weight:600;padding:3px 8px;border-radius:var(--radius-btn);}
.rp-badge.green {background:var(--color-success-tint);color:var(--color-success);}
.rp-badge.orange {background:var(--color-observado-tint);color:var(--color-observado);}
.rp-badge.blue {background:var(--color-info-tint);color:var(--color-info);}
.rp-badge.gray {background:var(--color-neutral-100);color:var(--color-text-secondary);}
.filtros {display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
.filtros select {font-family:inherit;font-size:12px;padding:7px 10px;border:1px solid var(--color-border);border-radius:8px;background:white;}
.meta-ciclo {font-size:12px;color:var(--color-text-secondary);margin-bottom:4px;}
.meta-dias {font-size:13px;font-weight:600;margin-bottom:16px;color:var(--color-text-secondary);}
.meta-dias[data-urgente="true"] {color:var(--color-danger);}
.meta-mensaje:not(:empty) {background:white;border:1px dashed var(--color-border);border-radius:12px;padding:24px;text-align:center;font-size:13px;color:var(--color-text-secondary);}
.meta-fila {display:flex;align-items:center;gap:16px;background:white;border:1px solid var(--color-border);border-radius:12px;padding:14px 16px;margin-bottom:10px;flex-wrap:wrap;}
.meta-fila.meta-borrador {border-left:4px solid var(--color-observado);background:var(--color-observado-tint);}
.meta-fila.meta-pendiente {border-left:4px solid var(--color-neutral-300);}
.meta-fila.meta-vencida {border-color:var(--color-danger);}
.meta-info {flex:1;min-width:200px;}
.meta-codigo {font-family:monospace;font-size:11px;font-weight:700;color:var(--color-text-secondary);}
.meta-nombre {font-size:13px;font-weight:600;line-height:1.4;margin-top:2px;}
.meta-detalle {font-size:11px;color:var(--color-text-secondary);margin-top:2px;}
.meta-anterior {font-size:11px;color:var(--color-text-secondary);margin-top:2px;}
.meta-anterior strong {color:var(--color-text-primary);font-weight:500;}
.meta-estado {display:flex;gap:6px;flex-wrap:wrap;}
.meta-badge {font-size:10px;font-weight:600;padding:3px 8px;border-radius:var(--radius-btn);background:var(--color-neutral-100);color:var(--color-text-secondary);}
.meta-badge.meta-borrador {background:var(--color-observado-tint);color:var(--color-observado);}
.meta-badge-vencida {background:var(--color-danger);color:white;}
.meta-enlace {font-size:12px;font-weight:600;padding:6px 14px;border-radius:var(--radius-btn);background:var(--color-primary);color:white;text-decoration:none;}
.meta-enlace:hover {background:var(--color-accent-dark);}
</style>

        <option value="">Todos los niveles</option>

  document.getElementById('avatarEl').textContent = u.iniciales;
  document.getElementById('topnavName').textContent = u.nombre;
  document.getElementById('topnavRole').textContent = u.gerencia;
})();
pintarNavPlaneacion();
cargarMetas();
iniciarContadorDias();
</script>
